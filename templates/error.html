{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="text-center py-5">
  <p class="display-1 fw-bold text-success mb-0">{{ code }}</p>
  <h1 class="h3 mb-3">{{ title }}</h1>
  <p class="text-muted mb-4">{{ message }}</p>
  <a href="{{ url_for('public.home') }}" class="btn btn-success me-2">Back to home</a>
  <a href="{{ url_for('public.places') }}" class="btn btn-outline-success">Browse places</a>
</div>
{% endblock %}
