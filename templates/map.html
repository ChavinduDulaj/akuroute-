{% extends "base.html" %}
{% block title %}Map{% endblock %}

{% block head %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Map of places</h1>
<p class="text-muted">Tap a marker to see the place name and category.</p>
<div id="map" class="map-large rounded border"></div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const places = {{ places_json|tojson }};

  const map = L.map('map').setView([5.95, 80.5], 10);     // centred roughly on Akuressa
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  function makePopup(p) {
    // Built with textContent so place names can never inject HTML
    const box = document.createElement('div');
    const title = document.createElement('strong');
    title.textContent = p.name;
    const cats = document.createElement('div');
    cats.textContent = p.cats;
    const link = document.createElement('a');
    link.href = '/places/' + p.id;
    link.textContent = 'View details';
    box.append(title, cats, link);
    return box;
  }

  const points = [];
  places.forEach(p => {
    L.marker([p.lat, p.lng]).addTo(map).bindPopup(makePopup(p));
    points.push([p.lat, p.lng]);
  });

  if (points.length > 1) {
    const bounds = L.latLngBounds(points);
    if (!bounds.getSouthWest().equals(bounds.getNorthEast())) {
      map.fitBounds(bounds, { padding: [30, 30] });       // zoom to show every marker
    }
  }
</script>
{% endblock %}
